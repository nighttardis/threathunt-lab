---

- name: Deploy Sinks
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/vector/{{ item }}"
    owner: root
    group: vector
    mode: '0640'
  with_items:
    - sources/01-logstash.yml
  notify: Restart Vector

- name: Deploy Transforms
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/vector/{{ item }}"
    owner: root
    group: vector
    mode: '0640'
  with_items:
    - transforms/01-logstash_base.yml
    - transforms/02-router.yml
    - transforms/03-winlogbeat.yml
    - transforms/04-logscale.yml
  notify: Restart Vector

