- name: Deploy Sinks (Templates)
  become: true
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/vector/sinks/{{ item[:-3] }}"
    owner: root
    group: vector
    mode: '0640'
  with_items: 
    - 01-elastic-sink.yml.j2
    - 02-logscale-sink.yml.j2
  notify: Restart Vector