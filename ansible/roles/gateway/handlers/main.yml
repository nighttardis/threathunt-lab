---

- name: Restart DHCPD
  become: true
  ansible.builtin.systemd:
    name: isc-dhcp-server
    state: restarted
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: Save iptables
  become: true
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'
